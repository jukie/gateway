name: "proxy-cluster"
proxyCluster:
  destination:
    addressType: IP
    endpoints:
      - host: 8.7.6.5
        port: 10080
    name: proxy-cluster-0
    protocol: HTTP
  name: proxy-cluster-0
http:
  - name: "first-listener"
    address: "::"
    port: 10080
    hostnames:
      - "*"
    path:
      mergeSlashes: true
      escapedSlashesAction: UnescapeAndRedirect
    routes:
      - name: "first-route"
        hostname: "*"
        destination:
          name: "first-route-dest"
          settings:
            - endpoints:
                - host: "1.2.3.4"
                  port: 50000
              name: "first-route-dest/backend/0"
